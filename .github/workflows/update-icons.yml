name: Update Map Icons
on:
  schedule:
    - cron: '0 */12 * * *'  # Runs every 12 hours
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Set DEFAULT_BRANCH env variable
        run: echo "DEFAULT_BRANCH=${{ github.event.repository.default_branch }}" >> $GITHUB_ENV
      - name: Get latest CS2 manifest ID
        id: cs2_manifest
        run: |
          node -e "
          const SteamUser = require('steam-user');
          const user = new SteamUser();
          user.logOn({ anonymous: true });
          user.once('loggedOn', async () => {
            const info = await user.getProductInfo([730], [], true);
            const gid = info.apps[730].appinfo.depots[2347770].manifests.public.gid;
            console.log('manifest=' + gid);
            process.exit(0);
          });
          " >> $GITHUB_OUTPUT
#      - name: Cache temp VPK files
#        uses: actions/cache@v4
#        with:
#          path: ./temp
#          key: ${{ runner.os }}-vpk-${{ steps.cs2_manifest.outputs.manifest }}
#          restore-keys: |
#            ${{ runner.os }}-vpk-
      - name: Get latest Source2Viewer-CLI version
        id: s2v_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ValveResourceFormat/ValveResourceFormat/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Cache Source2Viewer-CLI
        uses: actions/cache@v4
        with:
          path: ./s2v
          key: ${{ runner.os }}-s2v-${{ steps.s2v_version.outputs.version }}
      - name: Get latest DepotDownloader version
        id: dd_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/SteamRE/DepotDownloader/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Cache DepotDownloader
        uses: actions/cache@v4
        with:
          path: ./depot-downloader
          key: ${{ runner.os }}-depotdownloader-${{ steps.dd_version.outputs.version }}
      - name: Get latest oxipng version
        id: oxipng_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/oxipng/oxipng/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Cache oxipng
        uses: actions/cache@v4
        with:
          path: ./oxipng
          key: ${{ runner.os }}-oxipng-${{ steps.oxipng_version.outputs.version }}
      - name: Check if manifest changed
        id: manifest_check
        run: |
          NEW="${{ steps.cs2_manifest.outputs.manifest }}"
          OLD=$(cat static/manifest.txt 2>/dev/null || echo "")
          echo "old=$OLD"
          echo "new=$NEW"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Run scraper script
        run: node download-map-icons.js
      - name: Generate HTML
        if: steps.manifest_check.outputs.changed == 'true'
        run: node gen_html.js
      - name: Read manifestId.txt
        id: manifestId
        uses: juliangruber/read-file-action@v1
        with:
          path: ./static/manifest.txt
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Commit and push if changes
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: manifest ${{ steps.manifestId.outputs.content }}"

      - name: Generate release notes
        id: notes
        if: steps.manifest_check.outputs.changed == 'true' && steps.autocommit.outputs.changes_detected == 'true'
        run: |
          HASH="${{ steps.autocommit.outputs.commit_hash }}"
          MANIFEST="${{ steps.cs2_manifest.outputs.manifest }}"
          NOTES="$RUNNER_TEMP/release_notes.md"

          OLD_JSON="$RUNNER_TEMP/old_available.json"
          git show "$HASH^:data/available.json" > "$OLD_JSON" 2>/dev/null || echo '{"maps":{}}' > "$OLD_JSON"
          NEW_JSON="data/available.json"

          # New maps (not in previous available.json)
          ADDED=$(jq -r -n --slurpfile o "$OLD_JSON" --slurpfile n "$NEW_JSON" '
            ($n[0].maps | keys) - ($o[0].maps | keys) | .[]
            ' | while read -r m; do
              d=$(jq -r --arg m "$m" '.maps[$m].display_name // $m' "$NEW_JSON")
              echo "- \`$m\` ($d)"
            done)

          # Maps no longer present in the game files (origin got blanked)
          REMOVED=$(jq -r -n --slurpfile o "$OLD_JSON" --slurpfile n "$NEW_JSON" '
            $n[0].maps | to_entries[]
            | select(.value.origin == "" and (($o[0].maps[.key].origin // "") != ""))
            | .key' | sed 's/.*/- `&`/')

          # Per-file changes, grouped by asset type
          ICONS=""; RADARS=""; THUMBS=""; INFOS=""
          while IFS=$'\t' read -r status file; do
            case "$status" in A) label="new";; M) label="updated";; D) label="removed";; *) label="$status";; esac
            line="- \`$(basename "$file")\` ($label)"
            case "$file" in
              images/radars/*)     RADARS+="$line"$'\n' ;;
              images/thumbs/*)     THUMBS+="$line"$'\n' ;;
              data/radar_info/*)   INFOS+="$line"$'\n' ;;
              images/*)            ICONS+="$line"$'\n' ;;
            esac
          done < <(git diff --name-status --no-renames "$HASH^" "$HASH" -- images data/radar_info)

          section() { # title, body
            if [ -n "$2" ]; then
              printf '### %s\n%s\n\n' "$1" "$2"
            fi
          }

          {
            echo "Map icons updated for CS2 manifest \`$MANIFEST\`."
            echo
            section "🆕 New maps" "$ADDED"
            section "🗑️ Removed from game files" "$REMOVED"
            section "Icons" "$ICONS"
            section "Radars" "$RADARS"
            section "Screenshots" "$THUMBS"
            section "Radar info" "$INFOS"
            if [ -z "$ADDED$REMOVED$ICONS$RADARS$THUMBS$INFOS" ]; then
              echo "_No map asset changes detected in this manifest._"
            fi
          } > "$NOTES"

          # GitHub release bodies are capped at 125,000 chars
          head -c 120000 "$NOTES" > "$NOTES.tmp" && mv "$NOTES.tmp" "$NOTES"
          echo "path=$NOTES" >> $GITHUB_OUTPUT

      - name: Create release
        if: steps.manifest_check.outputs.changed == 'true' && steps.autocommit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST="${{ steps.cs2_manifest.outputs.manifest }}"
          TAG="manifest-$MANIFEST"

          # Skip if a release for this manifest already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi

          gh release create "$TAG" \
            --target "${{ steps.autocommit.outputs.commit_hash }}" \
            --title "CS2 manifest $MANIFEST" \
            --notes-file "${{ steps.notes.outputs.path }}"
